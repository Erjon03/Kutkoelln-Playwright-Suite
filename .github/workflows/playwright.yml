name: Storefront E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly full regression (03:00 UTC)
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching (e.g. @smoke)'
        required: false

# one run at a time against staging: a new run waits until the running one has finished
concurrency:
  group: storefront-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: 'true'
      PROJECT: kurtkoelln
      # environment details come only from repository variables / secrets — never from the code
      BASE_URL: ${{ vars.BASE_URL }}
      HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
      HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}
      ADMIN_CLIENT_ID: ${{ secrets.ADMIN_CLIENT_ID }}
      ADMIN_CLIENT_SECRET: ${{ secrets.ADMIN_CLIENT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SW_ACCESS_KEY: ${{ secrets.SW_ACCESS_KEY }}
      NEW_ACCOUNT_PASSWORD: ${{ secrets.NEW_ACCOUNT_PASSWORD }}
      PROMOTION_CODE: ${{ secrets.PROMOTION_CODE }}
      SKIP_CHECKOUT_TESTS: ${{ vars.SKIP_CHECKOUT_TESTS || 'false' }}
      # hardcoded on purpose: real contact form messages never run in CI
      SEND_MESSAGES: 'false'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard - configuration complete, no @sends-message tests
        run: |
          # a failing listing (e.g. missing variable/secret) stops the run before any test touches the shop
          LIST=$(npx playwright test --list) || { echo "::error::could not list tests - check the BASE_URL variable and the repository secrets"; exit 1; }
          if echo "$LIST" | grep -q "@sends-message\|valid submission shows a confirmation"; then
            echo "::error::a @sends-message test is in the test list - aborting"
            exit 1
          fi
      - name: Run tests
        run: |
          GREP="${{ github.event.inputs.grep }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then GREP="@smoke"; fi
          npx playwright test ${GREP:+--grep "$GREP"} --shard=${{ matrix.shard }}/2
      # blob report = this shard's results incl. traces/screenshots/videos, merged in the next job
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    name: Merge reports
    # runs even when tests failed, but not when the run was cancelled
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      # only combines the shard results, no tests run here; the run summary also goes to the run's summary page
      - name: Merge into one HTML + JUnit report + run summary
        run: npx playwright merge-reports --reporter html,junit,./src/reporting/RunSummaryReporter.ts ./all-blob-reports
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: playwright-report/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: run-summary/
          retention-days: 30
